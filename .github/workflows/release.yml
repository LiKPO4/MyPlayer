name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          # 构建工具链（Gradle 8.14.3 / AGP 8.11.1 / Kotlin 2.2.20）已满足 Flutter
          # 当前最低要求，不再固定 Flutter 版本，跟随 stable 频道。
          channel: stable
          cache: true

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MYPLAYER_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android/app/myplayer-release.jks

      - name: Build release APK
        env:
          MYPLAYER_KEYSTORE_PATH: ${{ github.workspace }}/android/app/myplayer-release.jks
          MYPLAYER_KEYSTORE_PASSWORD: ${{ secrets.MYPLAYER_KEYSTORE_PASSWORD }}
          MYPLAYER_KEY_ALIAS: ${{ secrets.MYPLAYER_KEY_ALIAS }}
          MYPLAYER_KEY_PASSWORD: ${{ secrets.MYPLAYER_KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk "MyPlayer-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "MyPlayer-${GITHUB_REF_NAME}.apk" --generate-notes --title "$GITHUB_REF_NAME"
